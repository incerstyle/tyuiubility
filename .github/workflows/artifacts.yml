name: Post-Merge Artifacts

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: artifacts-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  package-and-publish:
    name: Package and Publish to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: pnpm

      - name: Install dependencies
        run: bash scripts/ci-install-deps.sh

      - name: Package extension
        run: bash scripts/ci-package.sh

      - name: Upload packaged zips
        uses: actions/upload-artifact@v4
        with:
          name: tyuiubility
          path: |
            build/chrome-mv3-prod.zip
            build/firefox-prod.zip
          if-no-files-found: error

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install ORAS
        uses: oras-project/setup-oras@v1

      - name: Push artifacts to GHCR (sha + latest)
        run: bash scripts/artifacts-push-ghcr.sh
