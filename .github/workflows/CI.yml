name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, Types, Tests, Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Lint
        run: pnpm lint

      - name: Run Type Check
        run: pnpm check-types

      - name: Run Tests With Coverage
        run: pnpm test:coverage

      - name: Build extension
        run: pnpm build

  package-artifacts:
    name: Package Build Artifacts
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package extension
        run: pnpm package

      - name: Upload packaged zips
        uses: actions/upload-artifact@v4
        with:
          name: tyuiubility
          path: |
            build/chrome-mv3-prod.zip
            build/firefox-prod.zip
          if-no-files-found: error

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install ORAS
        uses: oras-project/setup-oras@v1

      - name: Push artifacts to GHCR (sha + latest)
        run: |
          OWNER_LC="$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')"
          REF_SHA="ghcr.io/${OWNER_LC}/tyuiubility:sha-${GITHUB_SHA}"
          REF_LATEST="ghcr.io/${OWNER_LC}/tyuiubility:latest"

          oras push "${REF_SHA}" \
            --artifact-type application/vnd.tyuiubility.extension.package.v1 \
            --annotation "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
            build/chrome-mv3-prod.zip:application/zip \
            build/firefox-prod.zip:application/zip

          oras push "${REF_LATEST}" \
            --artifact-type application/vnd.tyuiubility.extension.package.v1 \
            --annotation "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
            build/chrome-mv3-prod.zip:application/zip \
            build/firefox-prod.zip:application/zip
