name: Release and Publish
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag in format vX.Y.Z"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Release and Publish
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: latest

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: pnpm

    - name: Install dependencies
      run: bash scripts/ci-install-deps.sh

    - name: Package extension
      run: bash scripts/ci-package.sh

    - name: Browser Platform Publish (Chrome)
      uses: PlasmoHQ/bpp@v3
      with:
        keys: ${{ secrets.SUBMIT_KEYS_CHROME }}
        artifact: build/chrome-mv3-prod.zip
        verbose: true

    - name: Browser Platform Publish (Firefox)
      uses: PlasmoHQ/bpp@v3
      with:
        keys: ${{ secrets.SUBMIT_KEYS_FIREFOX }}
        artifact: build/firefox-prod.zip
        verbose: true
    
    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        name: Release ${{ env.RELEASE_TAG }}
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          build/chrome-mv3-prod.zip
          build/firefox-prod.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}