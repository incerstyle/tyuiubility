name: Release and Publish
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag in format vX.Y.Z"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: latest

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: "pnpm"

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run lint
      run: pnpm lint

    - name: Run type check
      run: pnpm check-types

    - name: Run tests
      run: pnpm test

    - name: Build the extension
      run: pnpm build

    - name: Package the extension
      run: mkdir -p build && pnpm package

    - name: Verify release tag and publish secrets
      run: |
        if ! echo "${RELEASE_TAG}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
          echo "Release tag must match vX.Y.Z. Got: ${RELEASE_TAG}"
          exit 1
        fi

        if [ -z "${{ secrets.SUBMIT_KEYS_CHROME }}" ]; then
          echo "Missing SUBMIT_KEYS_CHROME secret"
          exit 1
        fi

        if [ -z "${{ secrets.SUBMIT_KEYS_FIREFOX }}" ]; then
          echo "Missing SUBMIT_KEYS_FIREFOX secret"
          exit 1
        fi

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        name: Release ${{ env.RELEASE_TAG }}
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          build/chrome-mv3-prod.zip
          build/firefox-prod.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Install ORAS
      uses: oras-project/setup-oras@v1

    - name: Push release artifacts to GHCR
      run: |
        OWNER_LC="$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')"
        REF="ghcr.io/${OWNER_LC}/tyuiubility:${RELEASE_TAG}"

        oras push "${REF}" \
          --artifact-type application/vnd.tyuiubility.extension.package.v1 \
          --annotation "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
          --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
          --annotation "org.opencontainers.image.version=${RELEASE_TAG}" \
          build/chrome-mv3-prod.zip:application/zip \
          build/firefox-prod.zip:application/zip

    - name: Browser Platform Publish (Chrome)
      uses: PlasmoHQ/bpp@v3
      with:
        keys: ${{ secrets.SUBMIT_KEYS_CHROME }}
        artifact: build/chrome-mv3-prod.zip

    - name: Browser Platform Publish (Firefox)
      uses: PlasmoHQ/bpp@v3
      with:
        keys: ${{ secrets.SUBMIT_KEYS_FIREFOX }}
        artifact: build/firefox-prod.zip