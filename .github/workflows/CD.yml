name: Release and Publish
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag in format vX.Y.Z"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Release and Publish
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Verify release tag and publish secrets
      env:
        SUBMIT_KEYS_CHROME: ${{ secrets.SUBMIT_KEYS_CHROME }}
        SUBMIT_KEYS_FIREFOX: ${{ secrets.SUBMIT_KEYS_FIREFOX }}
      run: bash scripts/cd-verify.sh

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Install ORAS
      uses: oras-project/setup-oras@v1

    - name: Pull packaged artifacts from GHCR (sha)
      run: bash scripts/cd-pull-ghcr-artifacts.sh

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        name: Release ${{ env.RELEASE_TAG }}
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          build/chrome-mv3-prod.zip
          build/firefox-prod.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Push release artifacts to GHCR
      run: bash scripts/cd-push-release-ghcr.sh

    - name: Browser Platform Publish (Chrome)
      uses: PlasmoHQ/bpp@v3
      with:
        keys: ${{ secrets.SUBMIT_KEYS_CHROME }}
        artifact: build/chrome-mv3-prod.zip

    - name: Browser Platform Publish (Firefox)
      uses: PlasmoHQ/bpp@v3
      with:
        keys: ${{ secrets.SUBMIT_KEYS_FIREFOX }}
        artifact: build/firefox-prod.zip